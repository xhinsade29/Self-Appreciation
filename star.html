<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send a Love Star ⭐</title>  
    <link rel="stylesheet" href="styles/star.css">
</head>
<body>
    
    <!-- Back Button with Icon -->
    <button onclick="window.location.href='home.html'" class="back-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back
    </button>

    <div class="video-background">
        <video id="background-video" autoplay loop muted>
            <source src="resources/starry_night.mp4" type="video/mp4">
        </video>
    </div>

    <div class="header-container">
        <h1>Send a Love Star ⭐</h1>
        <p>Whenever you feel down, click the star to receive love and inspiration! 💖</p>
        <button class="love-btn" onclick="sendLove()">⭐ Send Love</button>
    </div>

    <div class="popup-overlay" id="overlay"></div>
    
    <div class="video-popup" id="video-popup">
        <video id="love-video">
            <source src="resources/star_effects.mp4" type="video/mp4">
        </video>
    </div>

    <div class="message-popup" id="message-popup">
        <p id="popup-text"></p>
        <img id="popup-image" class="popup-image" alt="Inspirational image">
        <button class="close-btn" onclick="closePopup()">Close</button>
    </div>

    <SCRipt src="scripts/star.js"></SCRipt>
    
</body>
</html>
