<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crazy Dares - Scratch & Reveal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Fredoka+One&display=swap"
      rel="stylesheet"
    />
    <!-- Add favicon -->
    <link rel="icon" href="resources/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles/scratch.css" />
    <!-- Add theme color for mobile browsers -->
    <meta name="theme-color" content="#ff758c" />

  </head>
  <body>

    <!-- Floating bubbles background -->
    <div class="floating-bubbles" id="bubbles"></div>

    <div class="game-container">
      <h1>🎭 Crazy Dares 🎭</h1>
      <p class="subtitle">
        Scratch a card to reveal your dare! Are you brave enough to accept the
        challenge?
      </p>

      <div class="difficulty-selector">
        <div class="difficulty-btn active" data-difficulty="easy">Easy</div>
        <div class="difficulty-btn" data-difficulty="medium">Medium</div>
        <div class="difficulty-btn" data-difficulty="hard">Hard</div>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
      </div>
      <div class="score-display">
        Courage Points: <span id="scoreValue">0</span>
      </div>

      <div class="container" id="cardContainer"></div>

      <div class="button-group">
        <button onclick="resetGame()" class="refresh-button">
          <span class="refresh-icon">🔄</span> New Dares
        </button>

        <button onclick="window.location.href='home.html'" class="back-button">
          <span class="back-icon">↩</span> Back to Home
        </button>
      </div>
    </div>

    <!-- Modal for Scratch Effect -->
    <div class="modal" id="scratchModal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalCard"></div>
      </div>
    </div>

    <script src="scripts/scratch.js"></script>
  </body>
</html>
